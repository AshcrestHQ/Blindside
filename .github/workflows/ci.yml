name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build_linux:
    name: Linux X11 Build & Tests
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Install git for checkout
        run: apt-get update && apt-get install -y git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            pkg-config \
            cmake \
            ninja-build \
            libopencv-dev \
            libx11-dev \
            libxext-dev \
            curl

      - name: Verify Toolchain & Dependencies
        run: |
          g++ --version
          gcc --version
          cmake --version
          ninja --version
          pkg-config --modversion opencv4

      - name: Download and Verify test fixture (YuNet model)
        run: |
          mkdir -p models
          URL="https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx"
          FILE="models/face_detection_yunet_2023mar.onnx"
          EXPECTED_SHA="8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4"
          
          curl -f -L -o $FILE $URL || { echo "Download failed"; exit 1; }
          if [ ! -s $FILE ]; then echo "File is empty"; exit 1; fi
          echo "$EXPECTED_SHA  $FILE" | sha256sum -c - || { echo "Checksum failed"; exit 1; }
          
          cat << 'EOF' > test_model.cpp
          #include <opencv2/dnn.hpp>
          #include <opencv2/objdetect.hpp>
          #include <iostream>
          int main() {
              try {
                  cv::Ptr<cv::FaceDetectorYN> detector = cv::FaceDetectorYN::create("models/face_detection_yunet_2023mar.onnx", "", cv::Size(320, 320));
                  std::cout << "Successfully loaded ONNX model using FaceDetectorYN." << std::endl;
              } catch (const cv::Exception& e) {
                  std::cerr << "OpenCV Exception: " << e.what() << std::endl;
                  return 1;
              }
              return 0;
          }
          EOF
          g++ test_model.cpp -o test_model $(pkg-config --cflags --libs opencv4)
          ./test_model
          
      - name: Configure (X11 Backend Explicit)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --output-junit test_results.xml

      - name: Prepare Release Artifact
        run: |
          mkdir -p build/Release
          cp build/blindside_daemon build/Release/
          cp -r models build/Release/
          cp LICENSE build/Release/
          cat << 'EOF' > build/Release/README.txt
          Blindside V3
          
          Requirements:
          - Linux x64 (X11 or Wayland)
          - OpenCV and X11 libraries:
            sudo apt-get install libopencv-core4.10 libopencv-videoio4.10 libopencv-objdetect4.10 libopencv-imgproc4.10 libopencv-calib3d4.10
          - webcam for live detection
          
          Run:
          ./blindside_daemon --diagnostics
          
          Then:
          ./blindside_daemon
          
          For source code and documentation:
          https://github.com/AshcrestHQ/Blindside
          EOF

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blindside-V3-Linux-x64
          path: |
            build/Release/blindside_daemon
            build/Release/models/
            build/Release/README.txt
            build/Release/LICENSE

  build_windows:
    name: Windows MSVC Build & Tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenCV
        run: |
          # Use vcpkg or chocolatey. Chocolatey is easiest for OpenCV on Windows runners
          choco install opencv -y

      - name: Download test fixture (YuNet model)
        run: |
          mkdir models
          curl -L "https://github.com/opencv/opencv_zoo/raw/master/models/face_detection_yunet/face_detection_yunet_2023mar.onnx" -o models/face_detection_yunet_2023mar.onnx
          
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOpenCV_DIR="C:\tools\opencv\build"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Prepare Release Artifact
        run: |
          $readme = @"
          Blindside V3

          Requirements:
          - Windows x64
          - webcam for live detection

          Run:

          blindside_daemon.exe --diagnostics

          Then:

          blindside_daemon.exe

          Troubleshooting:
          - missing model
          - missing DLL
          - camera unavailable

          For source code and documentation:
          https://github.com/AshcrestHQ/Blindside
          "@
          Set-Content -Path build\Release\README.txt -Value $readme
          Copy-Item LICENSE -Destination build\Release\LICENSE

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blindside-V3-Windows-x64
          path: |
            build/Release/blindside_daemon.exe
            build/Release/*.dll
            build/Release/models/
            build/Release/README.txt
            build/Release/LICENSE
