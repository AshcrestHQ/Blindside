name: 🐛 Bug Report
description: Report an issue, false positive detection, runtime crash, or display overlay bug.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please ensure you have tested with the latest `main` release or synthetic emulation mode before submitting.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true

  - type: dropdown
    id: OS
    attributes:
      label: Operating System
      description: Which OS are you running Blindside on?
      options:
        - Linux (Ubuntu / Debian)
        - Linux (Fedora / RHEL)
        - Linux (Arch / Manjaro)
        - Windows 11 / 10 (MSVC)
        - Other (specify below)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Hardware & Camera Environment
      description: Specify CPU, GPU, camera model, resolution, and CMake build flags.
      placeholder: |
        CPU: Intel i7-12700H
        GPU: Integrated Intel Iris Xe
        Camera: Logitech C920 (1080p @ 30fps)
        CMake Flags: -DCMAKE_BUILD_TYPE=Release
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce the issue?
      placeholder: |
        1. Build with `cmake ..`
        2. Run `./build/blindside_daemon --daemon`
        3. Observe crash or incorrect overlay behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console Output / Threat Logs
      description: Paste relevant terminal logs or `blindside_threats.log` snippets here.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct & Contribution Policy
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/AshcrestHQ/Blindside/blob/main/CODE_OF_CONDUCT.md).
          required: true
