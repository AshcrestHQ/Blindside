<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primaryGaze" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="threatGaze" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="450" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="450" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    🛡️ BLINDSIDE 3D SPATIAL GAZE VECTOR ESTIMATION
  </text>
  <text x="450" y="66" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">
    SolvePnP 6D Pose Vector Computation (Yaw ±30°, Pitch ±25° Screen Cone Threshold)
  </text>

  <!-- Display Monitor Representation -->
  <rect x="330" y="110" width="240" height="150" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="3" filter="url(#glow)"/>
  <rect x="340" y="120" width="220" height="130" rx="4" fill="#090d16"/>
  <text x="450" y="185" fill="#60a5fa" font-family="monospace" font-size="14" font-weight="600" text-anchor="middle">
    WORKSTATION DISPLAY
  </text>
  <text x="450" y="205" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">
    1920 x 1080 @ 60 Hz
  </text>
  
  <!-- Monitor Stand -->
  <path d="M 430 260 L 470 260 L 485 300 L 415 300 Z" fill="#334155"/>
  <rect x="400" y="300" width="100" height="8" rx="3" fill="#475569"/>

  <!-- Webcam Sensor -->
  <circle cx="450" cy="114" r="5" fill="#ef4444" filter="url(#glow)"/>
  <text x="450" y="104" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Webcam (640x480 @ 30 FPS)</text>

  <!-- Primary User (Green) -->
  <g transform="translate(450, 370)">
    <!-- User Head -->
    <circle cx="0" cy="-25" r="22" fill="#065f46" stroke="#10b981" stroke-width="2.5"/>
    <!-- Face Direction -->
    <path d="M 0 -47 L 0 -120" stroke="url(#primaryGaze)" stroke-width="3" stroke-dasharray="6,4" filter="url(#glow)"/>
    <polygon points="0,-125 -6,-115 6,-115" fill="#34d399"/>
    <!-- Label -->
    <text x="0" y="15" fill="#34d399" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Primary User</text>
    <text x="0" y="30" fill="#a7f3d0" font-family="monospace" font-size="10" text-anchor="middle">Yaw: 1.2° | Pitch: -3.4° (AUTHENTICATED)</text>
  </g>

  <!-- Secondary Eavesdropper (Red) -->
  <g transform="translate(730, 340)">
    <!-- Eavesdropper Head -->
    <circle cx="0" cy="-25" r="22" fill="#7f1d1d" stroke="#ef4444" stroke-width="2.5"/>
    <!-- Threat Gaze Vector pointing directly at screen -->
    <path d="M -15 -35 L -260 -180" stroke="url(#threatGaze)" stroke-width="3.5" filter="url(#glow)"/>
    <polygon points="-265,-183 -252,-175 -256,-187" fill="#f87171"/>
    <!-- Label -->
    <text x="0" y="15" fill="#f87171" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Eavesdropper / Bystander</text>
    <text x="0" y="30" fill="#fca5a5" font-family="monospace" font-size="10" text-anchor="middle">Yaw: -18.4° | Pitch: 4.1° (SCREEN GAZE DETECTED)</text>
  </g>

  <!-- Threat Cone / Line of Sight -->
  <path d="M 330 120 L 710 310" stroke="#f87171" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <path d="M 570 120 L 710 310" stroke="#f87171" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Legend Box -->
  <rect x="30" y="330" width="260" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <circle cx="50" cy="355" r="6" fill="#10b981"/>
  <text x="65" y="359" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12">Calibrated Primary Baseline</text>
  <circle cx="50" cy="385" r="6" fill="#ef4444"/>
  <text x="65" y="389" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12">Eavesdropper Gaze Intercept</text>
  <text x="40" y="410" fill="#64748b" font-family="monospace" font-size="10">Hysteresis: 1.0s -&gt; Hard Redaction</text>
</svg>
